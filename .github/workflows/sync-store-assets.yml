name: Sync Store Assets Branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-store-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Setup Executable from Release
        run: |
          curl -L -o InputLocker-Setup-v0.2.5.exe https://github.com/SHARUNJOSEPH/input-locker/releases/download/v0.2.5/InputLocker-Setup-v0.2.5.exe
          ls -lh InputLocker-Setup-v0.2.5.exe

      - name: Commit and Push to store-assets Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout origin/store-assets -B store-assets
          cp -f InputLocker-Setup-v0.2.5.exe .
          git add InputLocker-Setup-v0.2.5.exe
          git commit -m "chore: add v0.2.5 installer for Microsoft Store direct URL intake [skip ci]"
          git push origin store-assets
