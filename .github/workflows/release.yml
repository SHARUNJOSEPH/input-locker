name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Standalone Windows Executable
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller input_locker.spec --noconfirm --clean

      - name: Create Release Zip Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist/InputLocker.exe -DestinationPath dist/InputLocker-Windows-x64.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/InputLocker.exe
            dist/InputLocker-Windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
